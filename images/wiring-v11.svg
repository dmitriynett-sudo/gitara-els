<svg xmlns="http://www.w3.org/2000/svg" width="1190" height="842" viewBox="0 0 1190 842"><rect x="0" y="0" width="1190" height="842" rx="0" fill="white" stroke="white"/><rect x="0" y="0" width="10" height="842" rx="0" fill="#217653" stroke="#217653"/><text x="32" y="34" fill="#217653" font-family="Arial,sans-serif" font-size="15" font-weight="700" text-anchor="start">GITARA / V11</text><text x="1158" y="34" fill="#667b70" font-family="Arial,sans-serif" font-size="11" font-weight="400" text-anchor="end">СБОРКА И ПОДКЛЮЧЕНИЕ  |  ЛИСТ 1/4</text><text x="32" y="76" fill="#20362e" font-family="Arial,sans-serif" font-size="28" font-weight="700" text-anchor="start">Что подключается к плате</text><text x="32" y="105" fill="#667b70" font-family="Arial,sans-serif" font-size="13" font-weight="400" text-anchor="start">Типовая сборка на Waveshare RP2350-Touch-LCD-2. Рисунок функциональный: расположение контактов сверяйте по надписям GPIO.</text><path d="M32 122L1158 122" fill="none" stroke="#d4ded6" stroke-width="1"/><path d="M32 787L1158 787" fill="none" stroke="#d4ded6" stroke-width="1"/><text x="32" y="812" fill="#667b70" font-family="Arial,sans-serif" font-size="10" font-weight="400" text-anchor="start">Зелёный: соединения. Оранжевый + *: рекомендуемые доработки. Метки с одним именем - одна сеть.</text><text x="1158" y="812" fill="#667b70" font-family="Arial,sans-serif" font-size="10" font-weight="400" text-anchor="end">Формат A3 / 11.10.2026</text><rect x="34" y="153" width="265" height="160" rx="8" fill="#f4f8f4" stroke="#d4ded6"/><text x="50" y="181" fill="#235e93" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Энкодер шпинделя A/B</text><text x="50" y="207" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Пример: NPN, открытый коллектор.</text><text x="50" y="229" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">A и B - через входной буфер U2.</text><text x="50" y="251" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Z не используется.</text><text x="50" y="273" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Питание - по паспорту энкодера.</text><rect x="34" y="371" width="265" height="191" rx="8" fill="#f4f8f4" stroke="#d4ded6"/><text x="50" y="399" fill="#235e93" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Панель управления</text><text x="50" y="422" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Переключатель ON-OFF-ON:</text><text x="50" y="444" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">влево / нейтраль / вправо.</text><text x="50" y="466" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Три кнопки без фиксации:</text><text x="50" y="488" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">MICRO L, MICRO R, RAPID.</text><text x="50" y="510" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Все контакты замыкают вход на GND.</text><rect x="406" y="154" width="294" height="408" rx="8" fill="#eaf1eb" stroke="#217653"/><text x="553" y="190" fill="#217653" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">Waveshare</text><text x="553" y="218" fill="#20362e" font-family="Arial,sans-serif" font-size="20" font-weight="700" text-anchor="middle">RP2350-Touch-LCD-2</text><rect x="440" y="245" width="226" height="166" rx="5" fill="#17231e" stroke="#17231e"/><text x="553" y="290" fill="#a4deb5" font-family="Arial,sans-serif" font-size="25" font-weight="700" text-anchor="middle">GITARA V11</text><rect x="455" y="310" width="94" height="24" rx="3" fill="#17669d" stroke="#17669d"/><text x="502" y="327" fill="white" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle">FEED</text><rect x="553" y="310" width="94" height="24" rx="3" fill="#1e8a77" stroke="#1e8a77"/><text x="600" y="327" fill="white" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle">AFEED</text><rect x="455" y="338" width="94" height="24" rx="3" fill="#ab2529" stroke="#ab2529"/><text x="502" y="355" fill="white" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle">THREAD</text><rect x="553" y="338" width="94" height="24" rx="3" fill="#74278e" stroke="#74278e"/><text x="600" y="355" fill="white" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle">DIVIDER</text><rect x="455" y="366" width="94" height="24" rx="3" fill="#ad7d20" stroke="#ad7d20"/><text x="502" y="383" fill="white" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle">CYCLE</text><rect x="553" y="366" width="94" height="24" rx="3" fill="#425648" stroke="#425648"/><text x="600" y="383" fill="white" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle">SETUP</text><text x="435" y="450" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Экран, тач и слот microSD</text><text x="435" y="472" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">уже установлены на модуле.</text><text x="435" y="494" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">GPIO: только логика 3,3 В.</text><text x="435" y="516" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">На входы GPIO нельзя подавать 5 В.</text><rect x="795" y="153" width="360" height="181" rx="8" fill="#f4f8f4" stroke="#d4ded6"/><text x="811" y="181" fill="#235e93" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Драйвер STEP / DIR / ENA</text><text x="811" y="205" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Через выходной буфер U3, 3,3 -&gt; 5 В.</text><text x="811" y="227" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Пример подключения: DM556S, общий +5 В.</text><text x="811" y="249" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Клеммы PUL / DIR / ENA - сигнальные.</text><text x="811" y="271" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">A+ / A- / B+ / B- - две обмотки двигателя.</text><text x="811" y="293" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Напряжение и ток - по паспорту драйвера.</text><rect x="795" y="390" width="360" height="172" rx="8" fill="#f4f8f4" stroke="#d4ded6"/><text x="811" y="418" fill="#235e93" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Питание и звуковой сигнал</text><text x="811" y="442" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Плата и буфер U3: стабилизированные +5 В.</text><text x="811" y="464" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">U2: +3V3 с модуля Waveshare.</text><text x="811" y="486" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Маломощный активный зуммер 5 В.</text><text x="811" y="508" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Силовой источник питает только драйвер.</text><text x="811" y="530" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Земли логики соединены общей сетью GND.</text><path d="M299 223L406 223" fill="none" stroke="#217653" stroke-width="1.8"/><text x="353" y="211" fill="#217653" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle">A/B -&gt; U2 -&gt; GPIO</text><path d="M299 450L406 450" fill="none" stroke="#217653" stroke-width="1.8"/><text x="353" y="438" fill="#217653" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle">Кнопки -&gt; U2 -&gt; GPIO</text><path d="M700 245L795 245" fill="none" stroke="#217653" stroke-width="1.8"/><text x="747" y="233" fill="#217653" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle">GPIO -&gt; U3 -&gt; DRIVER</text><path d="M700 477L795 477" fill="none" stroke="#217653" stroke-width="1.8"/><text x="747" y="465" fill="#217653" font-family="Arial,sans-serif" font-size="10" font-weight="700" text-anchor="middle">5V / GND / BUZZER</text><rect x="34" y="611" width="1121" height="143" rx="8" fill="#f4f8f4" stroke="#d4ded6"/><text x="50" y="639" fill="#235e93" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="start">Перед подключением</text><text x="51" y="660" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Это монтажная схема конкретной распиновки V11, а не универсальная схема для всех драйверов и энкодеров.</text><text x="51" y="682" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Сначала соберите и проверьте цепи +5 В / +3,3 В без силового двигателя. Затем подключайте сигналы.</text><text x="51" y="704" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Плату питают либо от USB, либо от внешних +5 В: два независимых источника одновременно не соединять.</text><text x="51" y="726" fill="#667b70" font-family="Arial,sans-serif" font-size="14" font-weight="400" text-anchor="start">Для платы с другим размером экрана или другой распиновкой эта схема и опубликованный UF2 не подходят.</text></svg>